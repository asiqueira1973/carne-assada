name: CarneAssada
options:
  bundleIdPrefix: com.dablab
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  CarneAssada:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: CarneAssada
    resources: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dablab.carneassada
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: CarneAssada/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  CarneAssadaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: CarneAssadaTests
    dependencies:
      - target: CarneAssada
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dablab.carneassada.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CarneAssada:
    build:
      targets:
        CarneAssada: all
        CarneAssadaTests: [test]
    run:
      config: Debug
      # Critério 8.10: o produto não-consumível é configurado em .storekit para o
      # desenvolvimento, para o paywall exibir o Product.displayPrice de verdade.
      storeKitConfiguration: CarneAssada/Store/CarneAssada.storekit
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - CarneAssada
      targets:
        - CarneAssadaTests
